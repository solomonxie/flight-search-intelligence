# One KafkaTopic CR per internal/kafka topic constant — replaces
# `make kafka-topics`'s manual kafka-topics.sh calls in the cluster
# (the Strimzi Topic Operator, entityOperator.topicOperator above,
# reconciles these).
{{- range .Values.topics }}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: {{ .name }}
  labels:
    strimzi.io/cluster: {{ $.Values.clusterName }}
spec:
  partitions: {{ .partitions }}
  replicas: {{ .replicationFactor }}
{{- end }}
