# main.go is a scaffold: it prints one line and returns (see cmd/README.md
# "search-api/"), so this Deployment will exit(0) and restart on a loop
# until it actually serves something — expected, not a chart bug.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-api
  labels:
    app.kubernetes.io/name: search-api
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: search-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: search-api
    spec:
      containers:
        - name: search-api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
