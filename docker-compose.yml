# Local dev stack. TODO: add Dockerfiles for collector/search-api once
# they have real logic; for now this documents the intended shape -- a
# Postgres instance the two Go services talk to.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: flight_search
      POSTGRES_USER: flight_search
      POSTGRES_PASSWORD: flight_search
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
